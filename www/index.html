<style>
:root{--cream:#f4ebdd;--gold:#d6b779;--ink:#292522;--rose:#e7d8d0;--muted:#766d64;--paper:#fffdf9;--line:#e7ded2;--green:#496b56;--shadow:0 12px 32px #2925220d}
*{box-sizing:border-box}body{margin:0;background:#f8f5ef;color:var(--ink);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #d6b779;outline-offset:2px}
.topbar{background:var(--ink);color:white;padding:18px clamp(16px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.brand{display:flex;gap:12px;align-items:center}.monogram{width:44px;height:44px;border:1px solid var(--gold);color:var(--gold);border-radius:50%;display:grid;place-items:center;font-family:Georgia,serif;font-size:20px}.brand h1{font:normal 22px Georgia,serif;margin:0}.brand p{margin:2px 0 0;color:#d7cec3;font-size:12px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}
button,.btn{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:650}.btn-primary{background:var(--gold);border-color:var(--gold)}.btn-dark{background:var(--ink);color:white;border-color:var(--ink)}.btn-small{padding:6px 9px;font-size:12px}.danger{color:#9b3434}
.shell{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:calc(100vh - 80px)}aside{padding:22px 14px;border-right:1px solid var(--line);background:#fbf8f3}.nav-label{font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#958879;font-weight:800;padding:12px 12px 6px}.nav{width:100%;text-align:left;border:0;background:transparent;padding:11px 12px;border-radius:10px;font-weight:600;color:#61584f;display:flex;gap:10px;align-items:center}.nav.active,.nav:hover{background:var(--cream);color:var(--ink)}.nav .ico{width:22px;text-align:center}.side-note{margin:22px 8px 0;padding:14px;background:white;border:1px solid var(--line);border-radius:12px;font-size:12px;color:var(--muted)}
main{padding:clamp(16px,3vw,34px);max-width:1500px;width:100%;margin:0 auto}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:24px;flex-wrap:wrap}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:#907746;font-weight:800}.page-head h2{font:normal clamp(26px,3vw,36px) Georgia,serif;margin:4px 0 6px}.page-head p{margin:0;color:var(--muted);max-width:700px}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:22px}.stat,.panel,.content-card{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.stat{padding:18px}.stat span{display:block;color:var(--muted);font-size:12px}.stat strong{display:block;font:normal 30px Georgia,serif;margin-top:4px}.cols{grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr)}.panel{padding:20px;margin-bottom:18px}.panel h3{font:normal 21px Georgia,serif;margin:0 0 14px}.panel p{color:var(--muted)}.quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.quick{padding:18px;border:1px solid var(--line);border-radius:14px;background:#fff}.quick .symbol{font-size:23px}.quick h4{margin:7px 0 3px}.quick p{font-size:13px;margin:0 0 12px}.tag{display:inline-flex;align-items:center;padding:4px 8px;border-radius:99px;background:var(--cream);font-size:11px;font-weight:750;color:#66543b}.muted{color:var(--muted)}.small{font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.toolbar input,.toolbar select{max-width:100%;width:auto;min-width:160px}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px}.field label{font-size:12px;font-weight:750;color:#62584e}.field input,.field textarea,.field select,input,textarea,select{border:1px solid #ded4c7;border-radius:9px;background:white;padding:10px 11px;color:var(--ink);width:100%}.field textarea{min-height:94px;resize:vertical}.field textarea.tall{min-height:150px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .field{margin:0}.span-2{grid-column:1/-1}.post-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.content-card{overflow:hidden;display:flex;flex-direction:column}.cover{height:190px;background:linear-gradient(135deg,#f4ebdd,#e7d8d0);display:grid;place-items:center;position:relative;overflow:hidden;color:#7d6b55}.cover img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.cover .cover-placeholder{text-align:center;padding:20px;position:relative}.cover .cover-placeholder b{display:block;font:22px Georgia,serif}.cover .cover-placeholder span{font-size:12px}.card-body{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}.card-body h3{margin:0;font:normal 21px Georgia,serif}.card-body p{margin:0;color:var(--muted);font-size:13px}.card-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:auto;padding-top:8px}.content-text{white-space:pre-wrap;background:#fbf7f0;border-radius:9px;padding:10px;font-size:13px;max-height:130px;overflow:auto}.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.85fr);gap:18px}.preview{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;position:sticky;top:16px;align-self:start}.preview-img{aspect-ratio:4/5;background:var(--cream);display:grid;place-items:center;position:relative;overflow:hidden}.preview-img img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.preview-copy{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:28px;background:linear-gradient(0deg,#29252222,transparent 65%);color:#fff;text-shadow:0 2px 10px #0005}.preview-copy h3{font:normal 30px Georgia,serif;margin:8px 0}.preview-copy p{font-size:13px;letter-spacing:.08em}.preview-copy .logo{font-size:11px;letter-spacing:.22em;text-transform:uppercase}.preview-foot{padding:14px}.preview-foot h4{margin:0 0 8px}.empty{padding:35px 18px;text-align:center;color:var(--muted);border:1px dashed #d6cabb;border-radius:14px}.calendar-list{display:grid;gap:10px}.day-row{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:13px;align-items:center;padding:13px;border:1px solid var(--line);background:white;border-radius:12px}.day-num{background:var(--cream);border-radius:9px;text-align:center;padding:9px 4px;font-size:12px;font-weight:800}.day-row h4{margin:0 0 3px}.day-row p{margin:0;color:var(--muted);font-size:12px}.day-row.done{opacity:.68}.day-row.done h4{text-decoration:line-through}.checkline{display:flex;align-items:center;gap:7px;font-size:12px}.checkline input{width:auto}.image-upload{border:1px dashed #cbbda9;padding:14px;border-radius:10px;background:#fcf9f4}.image-upload input{border:0;padding:7px 0;background:transparent}.image-upload small{display:block;color:var(--muted);margin-top:4px}.notice{background:#f5eee0;border-left:3px solid var(--gold);padding:12px 14px;border-radius:7px;font-size:13px}.footer{color:#9b9185;text-align:center;padding:24px;font-size:11px}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:white;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:50;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:translateY(0)}.checklist{display:grid;gap:10px}.checkitem{display:flex;gap:10px;align-items:flex-start}.checkitem input{width:auto;margin-top:5px}.checkitem span{font-size:14px}.palette{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:90px;height:65px;border-radius:10px;border:1px solid #0001;padding:8px;display:flex;align-items:end;font-size:10px;font-weight:800}.modal-backdrop{position:fixed;inset:0;background:#17141188;display:grid;place-items:center;padding:20px;z-index:40}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--paper);border-radius:16px;padding:22px}.modal h3{font:normal 24px Georgia,serif;margin-top:0}.close-row{display:flex;justify-content:space-between;align-items:center}.kpi{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.kpi:last-child{border-bottom:0}
@media(max-width:900px){.shell{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:8px;display:flex;overflow-x:auto;gap:3px}aside .nav-label,aside .side-note{display:none}.nav{white-space:nowrap;width:auto;padding:10px}.cols,.split{grid-template-columns:1fr}.preview{position:static}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.post-list,.quick-grid,.form-grid{grid-template-columns:1fr}.span-2{grid-column:auto}.day-row{grid-template-columns:55px minmax(0,1fr)}.day-row>div:last-child{grid-column:2}.topbar{align-items:flex-start}.top-actions button{font-size:12px;padding:8px}.cover{height:160px}}

/* ===== NOUVEAU DESIGN (v2) — couleurs principales : voir --blush, --bg, #2b2523 ===== */
:root{--blush:#f6e4df;--bg:#fcf7f3;--card:#fffaf7}
body{background:var(--bg)}h1,h2,h3,h4{font-family:'Playfair Display',Georgia,serif;font-weight:500}
.app{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:100vh}
.side{background:#2b2523;color:#eadfd8;padding:28px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{text-align:center;margin-bottom:30px;color:var(--gold)}.logo h1{font-size:32px;color:#fff;margin:6px 0 2px;line-height:1.1}.logo small{display:block;font-size:10px;letter-spacing:.22em;color:#cdbfb5}
.side .nav{color:#eadfd8;padding:15px 18px;font-size:16px;gap:16px;font-weight:500}.side .nav.active,.side .nav:hover{background:#4b403a;color:#fff}
.slogan{margin-top:auto;font:italic 22px 'Playfair Display',Georgia,serif;text-align:center;padding:26px 8px;color:#e8dcd2}
.dash{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:22px;align-items:start}
.editbar{display:flex;gap:12px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.hero{display:grid;grid-template-columns:36% 1fr;min-height:280px;border-radius:14px;overflow:hidden;background:linear-gradient(100deg,#e9d3c4,#f6e4df 60%,#f9ece5)}
.nophoto{grid-template-columns:1fr}.nophoto .hero-img{display:none}
.hero-img{position:relative;display:grid;place-items:center;color:#8a7260;font-size:13px}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,#000 60%,transparent);mask-image:linear-gradient(90deg,#000 60%,transparent)}
.hero-body{text-align:center;padding:28px 20px 18px;display:flex;flex-direction:column;justify-content:center}
.hero-body h2{font-size:clamp(38px,5vw,62px);margin:2px 0 6px;line-height:1}.hp{font-size:22px}.hero-body p{font-size:17px;margin:0 0 20px;color:var(--ink)}
.feats{display:grid;grid-template-columns:repeat(4,1fr);font-size:13px}.feats>div{padding:0 8px;border-left:1px solid #d9c3b8}.feats>div:first-child{border:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px}.box h3{font-size:24px;margin:0 0 8px;display:flex;gap:10px;align-items:center}.wide{margin-top:18px}
.minis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.mini{border:1px solid var(--line);border-radius:10px;padding:8px;background:#fff;display:flex;flex-direction:column;gap:7px;font-size:12px}
.mv{aspect-ratio:1/1.1;border-radius:6px;overflow:hidden;position:relative;display:grid;place-items:end start;padding:10px;background:linear-gradient(160deg,#e3c9b8,#b99983);color:#fff}
.mv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.mv b{position:relative;font:500 18px/1.1 'Playfair Display',Georgia,serif;text-shadow:0 1px 8px #0006}
.pill{background:var(--blush);border-radius:6px;padding:3px 8px;font-weight:600;align-self:flex-start}.mini h4{margin:0;font:600 13px Inter,sans-serif}.mini p{margin:0;color:var(--muted);flex:1}.mini button{background:var(--blush);border:0;font-size:12px;border-radius:6px}
.strip{display:grid;grid-template-columns:1.3fr repeat(5,1fr);gap:10px;background:var(--blush);border-radius:14px;padding:20px;align-items:center;font-size:12px;text-align:center}
.strip>div:first-child{text-align:left}.strip h3{font-size:20px;margin:0 0 6px}.strip p{margin:0;color:var(--muted)}
.bi span{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 8px;background:#f3d3cc;border-radius:50%}
.brandsw{width:100%;display:flex;align-items:center;gap:12px;justify-content:space-between;padding:14px 18px;margin-bottom:18px;background:var(--card);border-radius:12px;font:500 18px 'Playfair Display',Georgia,serif}
.mc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center;font-size:12px}.mc i{font-style:normal;padding:7px 0;border-radius:50%}.mc .dn{color:#6b625b}.mc .d{cursor:pointer}
.d.g{background:#dfe8d6}.d.r{background:#f9d9d6}.d.n{background:#eeeae6}
.lg{display:flex;gap:10px;font-size:11px;margin-top:12px;flex-wrap:wrap}.lg span:before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-2px;background:#eeeae6}.lg .g:before{background:#dfe8d6}.lg .r:before{background:#f9d9d6}
.pub{background:var(--blush)}.pub p{font-size:13px}.big{width:100%;padding:14px;display:flex;gap:10px;justify-content:center}
.qa{width:100%;display:flex;gap:12px;align-items:center;text-align:left;padding:12px;margin-top:8px;background:#fff;font-weight:500;font-size:13px}
.editing [data-t]{outline:1.5px dashed var(--gold);outline-offset:2px;cursor:text}.editing .hero-img{cursor:pointer;outline:1.5px dashed var(--gold)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}.thumbs img{width:90px;height:90px;object-fit:cover;border-radius:8px;cursor:pointer}
.thumbs.big figure{margin:0;width:200px;display:flex;flex-direction:column;gap:6px}.thumbs.big img{width:200px;height:200px;cursor:default}.up{display:inline-block}
.guide li{margin-bottom:10px}
@media(max-width:1200px){.dash{grid-template-columns:1fr}.minis{grid-template-columns:repeat(3,1fr)}.strip{grid-template-columns:repeat(3,1fr)}.strip>div:first-child{grid-column:1/-1}}
@media(max-width:800px){.app{grid-template-columns:1fr}.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px}.logo,.slogan{display:none}.side .nav{white-space:nowrap;padding:10px 12px;font-size:14px;width:auto}.hero{grid-template-columns:1fr}.hero-img{min-height:160px}.feats{grid-template-columns:1fr 1fr;gap:12px}.minis{grid-template-columns:repeat(2,1fr)}}
.steps{display:grid;gap:10px;margin-top:12px}.step{display:flex;gap:14px;align-items:center;text-align:left;padding:14px;background:#fff;border-radius:12px}.step small{color:var(--muted);font-weight:400}.sn{flex:none;width:38px;height:38px;border-radius:50%;background:var(--blush);display:grid;place-items:center;font:600 16px Inter,sans-serif}.step.ok .sn{background:#dfe8d6}.go{margin-left:auto;background:var(--ink);color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;flex:none}
.gbar{position:sticky;top:0;z-index:5;display:flex;gap:14px;justify-content:space-between;align-items:center;flex-wrap:wrap;background:#2b2523;color:#fff;padding:14px 18px;border-radius:12px;margin-bottom:16px;font-size:14px}.gbar span{color:#e8dcd2}.gb{display:flex;gap:8px;flex-wrap:wrap}
.bsel{width:100%;margin-top:12px;background:#4b403a;color:#fff;border:1px solid #6b5d56;border-radius:8px;padding:8px}.brandsw .bsel{margin:0;background:#fff;color:var(--ink);border:0;font:500 16px Inter,sans-serif}
.mv b{display:none}.tip{position:relative;background:#fffc;padding:6px 10px;border-radius:8px;font-size:12px;text-align:center;margin:8px}.gl{display:flex;gap:12px;align-items:center}.gl img{width:56px;height:70px;object-fit:cover;border-radius:6px;flex:none}.ga{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.kpi{flex-wrap:wrap}
.side{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#6b5d56 transparent}.side>*{flex-shrink:0}
@media(max-height:760px){.side .nav{padding:10px 16px;font-size:15px}.logo{margin-bottom:14px}.slogan{padding:12px 8px;font-size:18px}}
@media(max-width:800px){.side{overflow-y:hidden}}
@media print{.side,.toolbar,.editbar,button,.btn{display:none!important}.app{display:block}}
</style>

const initialSettings={brand:"Élégance House",tagline:"Le chic au quotidien.",sector:"Mode féminine, accessoires et élégance",positioning:"Chic, moderne, raffiné et accessible",city:"Lomé, Togo",contact:"WhatsApp Business",whatsapp:"",facebook:"",instagram:"",site:"",primary:"#F4EBDD",gold:"#D6B779",dark:"#292522",rose:"#E7D8D0",font:"Élégant et moderne",notes:""};
let state={settings:{...initialSettings},posts:[],tasks:{},page:"dashboard",editingId:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,"<br>");
function uid(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function save(){try{localStorage.setItem("ehStudioData",JSON.stringify({settings:state.settings,posts:state.posts,tasks:state.tasks}))}catch(e){toast("Stockage plein : exportez vos données et réduisez la taille des images.");}}
function load(){try{let x=JSON.parse(localStorage.getItem("ehStudioData"));if(x){state.settings={...initialSettings,...x.settings};state.posts=Array.isArray(x.posts)?x.posts:[];state.tasks=x.tasks||{};}}catch(e){} if(!state.posts.length){state.posts=SEED.map(p=>({...p,id:uid(),imageData:"",publishedDate:"",notes:"",done:false}));save()}}
function toast(s){let t=$("#toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400)}
function setPage(p){state.page=p;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.page===p));render()}
function pageHead(kicker,title,desc,action=""){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h2>${title}</h2><p>${desc}</p></div>${action}</div>`}
function stats(){let done=state.posts.filter(p=>p.done||p.status==="Publié").length;let imgs=state.posts.filter(p=>p.imageData).length;let drafts=state.posts.filter(p=>p.status==="À préparer"||p.status==="Brouillon").length;return `<div class="grid stats"><div class="stat"><span>Contenus dans le studio</span><strong>${state.posts.length}</strong></div><div class="stat"><span>Visuels ajoutés</span><strong>${imgs}</strong></div><div class="stat"><span>Publications terminées</span><strong>${done}</strong></div><div class="stat"><span>À préparer</span><strong>${drafts}</strong></div></div>`}
function dashboard(){let next=state.posts.find(p=>!p.done&&p.status!=="Publié")||state.posts[0];return pageHead("Votre espace de marque","Bonjour, Élégance House ✨","Votre atelier de contenu est prêt. Organisez vos idées, ajoutez vos photos et préparez vos publications.","<button class='btn-primary' onclick=\"openEditor()\">＋ Créer un contenu</button>")+stats()+`<div class="grid cols"><section><div class="panel"><h3>Commencer ici</h3><div class="grid quick-grid"><div class="quick"><div class="symbol">🖼️</div><h4>Ajouter vos photos</h4><p>Importez une image par publication et vérifiez le rendu.</p><button class="btn-small" onclick="setPage('posts')">Ouvrir les contenus</button></div><div class="quick"><div class="symbol">✍️</div><h4>Préparer un post</h4><p>Modifiez l'idée visuelle, le texte sur image, la légende et les hashtags.</p><button class="btn-small" onclick="openEditor()">Créer un post</button></div><div class="quick"><div class="symbol">🗓️</div><h4>Suivre les 30 jours</h4><p>Consultez votre calendrier et cochez les publications terminées.</p><button class="btn-small" onclick="setPage('calendar')">Voir le calendrier</button></div><div class="quick"><div class="symbol">💾</div><h4>Sauvegarder</h4><p>Exportez une copie de vos contenus et paramètres.</p><button class="btn-small" onclick="exportData()">Exporter les données</button></div></div></div><div class="panel"><h3>Votre prochaine publication</h3>${next?`<div class="kpi"><span>Contenu</span><b>${esc(next.title)}</b></div><div class="kpi"><span>Jour prévu</span><b>Jour ${next.day||"libre"}</b></div><div class="kpi"><span>Objectif</span><b>${esc(next.goal||"À définir")}</b></div><p>${esc(next.imageIdea||"Ajoutez une idée de visuel.")}</p><button class="btn-dark" onclick="openEditor('${next.id}')">Continuer la préparation →</button>`:`<p>Aucun contenu pour le moment.</p>`}</div></section><section><div class="panel"><h3>Identité visuelle</h3><p>Utilisez les mêmes couleurs pour que les publications soient immédiatement reconnaissables.</p><div class="palette"><div class="swatch" style="background:${esc(state.settings.primary)}">Crème</div><div class="swatch" style="background:${esc(state.settings.gold)}">Champagne</div><div class="swatch" style="background:${esc(state.settings.dark)};color:white">Noir</div><div class="swatch" style="background:${esc(state.settings.rose)}">Rose poudré</div></div><p><button class="btn-small" onclick="setPage('brand')">Modifier l'identité</button></p></div><div class="panel"><h3>Conseils de publication</h3><div class="checklist"><label class="checkitem"><input type="checkbox" onchange="taskCheck('real',this.checked)" ${state.tasks.real?'checked':''}><span>Vérifier que les produits montrés sont réellement proposés.</span></label><label class="checkitem"><input type="checkbox" onchange="taskCheck('caption',this.checked)" ${state.tasks.caption?'checked':''}><span>Relire la légende et corriger les informations.</span></label><label class="checkitem"><input type="checkbox" onchange="taskCheck('contact',this.checked)" ${state.tasks.contact?'checked':''}><span>Vérifier le lien ou numéro de contact.</span></label><label class="checkitem"><input type="checkbox" onchange="taskCheck('save',this.checked)" ${state.tasks.save?'checked':''}><span>Faire une sauvegarde régulière.</span></label></div></div><div class="notice">Cette application prépare et organise les contenus. Elle ne publie pas automatiquement sur Facebook ou Instagram.</div></section></div>`}
function postCard(p){return `<article class="content-card"><div class="cover">${p.imageData?`<img src="${p.imageData}" alt="Visuel de ${esc(p.title)}">`:`<div class="cover-placeholder"><b>${esc(p.title)}</b><span>Visuel à ajouter · Jour ${p.day||"libre"}</span></div>`}</div><div class="card-body"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><span class="tag">${esc(p.type||"Contenu")}</span><span class="small muted">Jour ${p.day||"—"}</span></div><h3>${esc(p.title)}</h3><p>${esc(p.goal||"Objectif à préciser")}</p><div class="content-text">${esc(p.caption||"Ajoutez une légende.")}</div><div class="card-actions"><button class="btn-small btn-dark" onclick="openEditor('${p.id}')">Modifier</button><button class="btn-small" onclick="copyPost('${p.id}')">Copier le texte</button><button class="btn-small" onclick="waCopy('${p.id}')">Lien WhatsApp</button><button class="btn-small" onclick="canva('${p.id}')">Canva</button><button class="btn-small" onclick="trackOpen('${p.id}')">Résultats</button><button class="btn-small" onclick="toggleDone('${p.id}')">${p.done||p.status==="Publié"?"✓ Terminé":"Marquer terminé"}</button></div></div></article>`}
function postsPage(){return pageHead("Bibliothèque","Mes contenus","Tous vos posts au même endroit. Ouvrez un contenu pour le modifier, ajouter une photo ou copier sa légende.","<button class='btn-primary' onclick=\"openEditor()\">＋ Nouveau contenu</button>")+`<div class="toolbar"><input id="searchPosts" placeholder="Rechercher un contenu…" oninput="filterPosts()" /><select id="filterType" onchange="filterPosts()"><option value="">Tous les types</option>${[...new Set(state.posts.map(p=>p.type).filter(Boolean))].sort().map(x=>`<option>${esc(x)}</option>`).join("")}</select><select id="filterStatus" onchange="filterPosts()"><option value="">Tous les statuts</option><option>À préparer</option><option>Brouillon</option><option>Prêt à publier</option><option>Publié</option></select></div><div id="postResults" class="post-list">${state.posts.map(postCard).join("")}</div>`}
function filterPosts(){let q=($("#searchPosts")?.value||"").toLowerCase(),t=$("#filterType")?.value||"",s=$("#filterStatus")?.value||"";let arr=state.posts.filter(p=>(p.title+" "+p.caption+" "+p.type).toLowerCase().includes(q)&&(!t||p.type===t)&&(!s||p.status===s));$("#postResults").innerHTML=arr.length?arr.map(postCard).join(""):`<div class="empty" style="grid-column:1/-1">Aucun contenu ne correspond à ces filtres.</div>`}
function calendarPage(){return pageHead("Planification","Calendrier éditorial — 30 jours","Cochez chaque contenu une fois terminé. Vous pouvez modifier chaque journée ou réorganiser les dates dans l'éditeur.")+`<div class="toolbar"><label class="small">Date de départ <input type="date" id="startDate" value="${esc(state.settings.startDate||new Date().toISOString().slice(0,10))}" onchange="updateStartDate(this.value)" /></label><select id="calendarFilter" onchange="filterCalendar()"><option value="">Tous les contenus</option><option value="open">À faire</option><option value="done">Terminés</option></select><button onclick="exportCalendar()">Exporter le calendrier .CSV</button></div><div id="calendarList" class="calendar-list">${calendarRows(state.posts)}</div>`}
function calendarRows(arr){let start=state.settings.startDate||new Date().toISOString().slice(0,10);return arr.slice().sort((a,b)=>(a.day||999)-(b.day||999)).map(p=>{let d=new Date(start+"T12:00:00");d.setDate(d.getDate()+Math.max(0,(p.day||1)-1));let date=d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short"});return `<div class="day-row ${(p.done||p.status==='Publié')?'done':''}" data-done="${(p.done||p.status==='Publié')?'done':'open'}"><div class="day-num">JOUR ${p.day||"—"}<br><span class="muted">${date}</span></div><div><h4>${esc(p.title)}</h4><p>${esc(p.type||"Contenu")} · Objectif : ${esc(p.goal||"À définir")}</p><p>${esc(p.imageIdea||"Idée visuelle à compléter")}</p></div><div style="display:flex;gap:6px;flex-wrap:wrap"><label class="checkline"><input type="checkbox" ${p.done||p.status==="Publié"?"checked":""} onchange="toggleDone('${p.id}',this.checked)"> Terminé</label><button class="btn-small" onclick="openEditor('${p.id}')">Ouvrir</button></div></div>`}).join("")||`<div class="empty">Aucun contenu. Créez votre premier post.</div>`}
function filterCalendar(){let v=$("#calendarFilter").value;document.querySelectorAll(".day-row").forEach(r=>r.classList.toggle("hidden",!!v&&r.dataset.done!==v))}
function updateStartDate(v){state.settings.startDate=v;save();$("#calendarList").innerHTML=calendarRows(state.posts);filterCalendar()}
function plannerPage(){return pageHead("Atelier de création","Créer ou modifier un contenu","Complétez les champs, ajoutez une image, prévisualisez votre publication et copiez les textes séparément.")+`<div class="panel"><div class="empty"><h3>Votre atelier de création</h3><p>Créez un nouveau contenu ou choisissez un post existant à modifier.</p><button class="btn-primary" onclick="openEditor()">＋ Ouvrir le formulaire de création</button></div></div><div class="panel"><h3>Comment procéder ?</h3><ol><li>Donnez un titre au contenu et choisissez le jour prévu.</li><li>Décrivez l'image et importez votre propre photo.</li><li>Écrivez le texte court à intégrer au visuel.</li><li>Complétez la légende, les hashtags et la version story.</li><li>Enregistrez puis copiez les éléments à publier.</li></ol></div>`}
function brandPage(){let s=state.settings;return pageHead("Univers de marque","Identité de marque","Centralisez les informations qui doivent rester cohérentes sur vos visuels et vos publications.","<button class='btn-primary' onclick=\"saveBrand()\">Enregistrer l'identité</button>")+`<div class="grid cols"><section class="panel"><h3>Informations principales</h3><div class="field"><label>Nom de la marque</label><input id="brandName" value="${esc(s.brand)}"></div><div class="field"><label>Signature / slogan</label><input id="brandTagline" value="${esc(s.tagline)}"></div><div class="field"><label>Secteur</label><input id="brandSector" value="${esc(s.sector)}"></div><div class="field"><label>Positionnement</label><input id="brandPositioning" value="${esc(s.positioning)}"></div><div class="field"><label>Ville / zone</label><input id="brandCity" value="${esc(s.city)}"></div><div class="field"><label>Moyen de contact</label><input id="brandContact" value="${esc(s.contact)}"></div><div class="field"><label>Lien ou numéro WhatsApp (format international recommandé)</label><input id="brandWhatsapp" placeholder="Ex. https://wa.me/228XXXXXXXX" value="${esc(s.whatsapp)}"></div><div class="field"><label>Lien Facebook</label><input id="brandFacebook" value="${esc(s.facebook)}"></div><div class="field"><label>Lien Instagram</label><input id="brandInstagram" value="${esc(s.instagram)}"></div><div class="field"><label>Site web</label><input id="brandSite" value="${esc(s.site)}"></div><div class="field"><label>Notes internes</label><textarea id="brandNotes">${esc(s.notes)}</textarea></div></section><section><div class="panel"><h3>Palette officielle</h3><p>Tu peux changer les codes hexadécimaux et les réutiliser dans tes outils graphiques.</p><div class="form-grid"><div class="field"><label>Beige crème</label><input id="colorPrimary" value="${esc(s.primary)}" type="color"></div><div class="field"><label>Or champagne</label><input id="colorGold" value="${esc(s.gold)}" type="color"></div><div class="field"><label>Noir élégant</label><input id="colorDark" value="${esc(s.dark)}" type="color"></div><div class="field"><label>Rose poudré</label><input id="colorRose" value="${esc(s.rose)}" type="color"></div></div><div class="palette" style="margin-top:15px"><div class="swatch" style="background:${esc(s.primary)}">Crème<br>${esc(s.primary)}</div><div class="swatch" style="background:${esc(s.gold)}">Champagne<br>${esc(s.gold)}</div><div class="swatch" style="background:${esc(s.dark)};color:white">Noir<br>${esc(s.dark)}</div><div class="swatch" style="background:${esc(s.rose)}">Rose<br>${esc(s.rose)}</div></div><button style="margin-top:16px" onclick="saveBrand()">Enregistrer les changements</button></div><div class="panel"><h3>Signature de marque</h3><div style="background:${esc(s.primary)};padding:30px;text-align:center;border-radius:12px"><div style="font:italic 28px Georgia,serif">${esc(s.brand)}</div><div style="letter-spacing:.1em;margin-top:8px;font-size:12px">${esc(s.tagline)}</div></div></div></section></div>`}
function checklistPage(){let items=[["c1","Définir les produits réellement vendus et les prix."],["c2","Ajouter une photo réelle ou un visuel autorisé pour chaque produit."],["c3","Compléter le profil de marque et les moyens de contact."],["c4","Vérifier l'orthographe, les prix, tailles et disponibilités."],["c5","Préparer le format adapté à Facebook, Instagram ou aux stories."],["c6","Publier le contenu sur la plateforme choisie."],["c7","Répondre aux commentaires et aux messages."],["c8","Noter les résultats : portée, commentaires, partages et demandes."],["c9","Sauvegarder les données de l'application après les modifications."]];return pageHead("Guide pratique","Votre parcours étape par étape","Utilisez cette liste comme procédure de travail. Votre progression reste enregistrée sur cet appareil.")+`<div class="grid cols"><section class="panel"><h3>Checklist de lancement</h3><div class="checklist">${items.map(([id,label])=>`<label class="checkitem"><input type="checkbox" ${state.tasks[id]?'checked':''} onchange="taskCheck('${id}',this.checked)"><span>${esc(label)}</span></label>`).join("")}</div><p id="checkProgress" class="tag">${items.filter(([id])=>state.tasks[id]).length} / ${items.length} étapes terminées</p></section><section><div class="panel"><h3>Routine d'une publication</h3><ol><li>Choisir un contenu dans la bibliothèque.</li><li>Ajouter une photo et vérifier le texte intégré au visuel.</li><li>Copier la légende et les hashtags.</li><li>Publier manuellement sur le réseau choisi.</li><li>Partager une story si cela convient.</li><li>Marquer le contenu comme terminé et noter les résultats.</li></ol></div><div class="notice"><b>À retenir :</b> cette application fonctionne localement. Elle ne se connecte pas à Facebook, Instagram ou WhatsApp et ne publie pas automatiquement.</div></section></div>`}
function settingsPage(){return pageHead("Contrôle de vos données","Paramètres & sauvegarde","Exportez vos données pour les transférer sur un autre appareil ou restaurer votre travail.")+`<div class="grid cols"><section class="panel"><h3>Sauvegarde</h3><p>La sauvegarde contient les contenus, les textes, les images importées, les paramètres de marque et la progression de la checklist.</p><button class="btn-primary" onclick="exportData()">↓ Télécharger une sauvegarde JSON</button> <button onclick="$('#importFile').click()">↑ Restaurer une sauvegarde</button><p class="small muted">Important : gardez une copie du fichier JSON dans un endroit sûr. Les données du navigateur peuvent disparaître si vous effacez les données du site.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Statistiques de votre espace</h3><div class="kpi"><span>Contenus</span><b>${state.posts.length}</b></div><div class="kpi"><span>Photos ajoutées</span><b>${state.posts.filter(p=>p.imageData).length}</b></div><div class="kpi"><span>Terminés</span><b>${state.posts.filter(p=>p.done||p.status==="Publié").length}</b></div><div class="kpi"><span>À préparer</span><b>${state.posts.filter(p=>!p.done&&p.status!=="Publié").length}</b></div></section><section class="panel"><h3>Actions de gestion</h3><button class="btn-small" onclick="exportCalendar()">Exporter le calendrier en CSV</button><p class="small muted">Un fichier CSV peut être ouvert avec Excel, Google Sheets ou LibreOffice Calc.</p><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Réinitialiser les exemples</h3><p>Cette action remplace la bibliothèque actuelle par les 30 contenus de départ. Exportez d'abord une sauvegarde si vous souhaitez conserver vos modifications.</p><button class="danger" onclick="resetSeed()">Remettre les textes d'origine (je garde mes photos)</button><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Effacer les données locales</h3><p>Supprime les contenus et les réglages enregistrés dans ce navigateur.</p><button class="danger" onclick="clearAll()">Retirer mes photos et mes modifications</button></section></div>`}
function render(){ $("#headerBrand").textContent=state.settings.brand||"Élégance House";let m=$("#main");if(state.page==="dashboard")m.innerHTML=dashboard();else if(state.page==="posts")m.innerHTML=postsPage();else if(state.page==="calendar")m.innerHTML=calendarPage();else if(state.page==="planner")m.innerHTML=plannerPage();else if(state.page==="brand")m.innerHTML=brandPage();else if(state.page==="checklist")m.innerHTML=checklistPage();else if(state.page==="settings")m.innerHTML=settingsPage();}
function taskCheck(id,val){state.tasks[id]=val;save();if(state.page==="checklist")render();else toast(val?"Étape cochée":"Étape décochée")}
function toggleDone(id,val){let p=state.posts.find(x=>x.id===id);if(!p)return;p.done=typeof val==="boolean"?val:!(p.done||p.status==="Publié");p.status=p.done?"Publié":(p.status==="Publié"?"À préparer":p.status);save();render()}
function openEditor(id){state.editingId=id||null;let p=id?state.posts.find(x=>x.id===id):{id:"",day:state.posts.length+1,title:"",type:"Autre",goal:"",imageIdea:"",imageText:"",caption:"",hashtags:"",story:"",platform:"Facebook et Instagram",status:"Brouillon",imageData:"",notes:"",publishedDate:"",done:false};if(!p)p={};$("#modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeEditor()"><div class="modal"><div class="close-row"><h3>${id?"Modifier le contenu":"Créer un contenu"}</h3><button onclick="closeEditor()">✕</button></div><form id="editorForm" onsubmit="savePost(event)"><input type="hidden" id="postId" value="${esc(p.id||"")}"><div class="form-grid"><div class="field"><label>Jour prévu</label><input id="pDay" type="number" min="1" max="365" value="${esc(p.day||"")}"></div><div class="field"><label>Type de contenu</label><input id="pType" value="${esc(p.type||"Autre")}" placeholder="Ex. Inspiration"></div><div class="field span-2"><label>Titre interne</label><input id="pTitle" required value="${esc(p.title||"")}" placeholder="Ex. Présentation d'un sac"></div><div class="field span-2"><label>Objectif du post</label><input id="pGoal" value="${esc(p.goal||"")}" placeholder="Ex. Générer des messages"></div><div class="field span-2"><label>Idée d'image / brief visuel</label><textarea id="pIdea" placeholder="Décris le visuel, le décor, les couleurs…">${esc(p.imageIdea||"")}</textarea></div><div class="field span-2"><label>Texte à mettre sur l'image</label><textarea id="pImageText" placeholder="Texte court pour le visuel">${esc(p.imageText||"")}</textarea></div><div class="field span-2"><label>Image personnelle</label><div class="image-upload"><input id="pImage" type="file" accept="image/*"><small>Formats image courants. Pour une meilleure sauvegarde, utilisez des fichiers optimisés de taille raisonnable.</small><div id="imageInfo">${p.imageData?"Une image est déjà associée à ce contenu.":""}</div><button type="button" class="btn-small" onclick="removeCurrentImage()">Retirer l'image</button></div></div><div class="field span-2"><label>Légende de publication</label><textarea class="tall" id="pCaption" placeholder="Texte complet du post">${esc(p.caption||"")}</textarea></div><div class="field span-2"><label>Hashtags</label><textarea id="pHashtags" placeholder="#EleganceHouse #ModeFeminine">${esc(p.hashtags||"")}</textarea></div><div class="field span-2"><label>Version courte pour story</label><textarea id="pStory" placeholder="Texte court pour la story">${esc(p.story||"")}</textarea></div><div class="field"><label>Plateforme</label><select id="pPlatform">${["Facebook et Instagram","Facebook","Instagram","WhatsApp Business","TikTok","Autre"].map(x=>`<option ${p.platform===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field"><label>Statut</label><select id="pStatus">${["À préparer","Brouillon","Prêt à publier","Publié"].map(x=>`<option ${p.status===x?"selected":""}>${x}</option>`).join("")}</select></div><div class="field span-2"><label>Date de publication réelle (facultatif)</label><input id="pPublishedDate" type="date" value="${esc(p.publishedDate||"")}"></div><div class="field span-2"><label>Notes / prix / détails internes</label><textarea id="pNotes" placeholder="Prix, tailles, disponibilité, lien produit…">${esc(p.notes||"")}</textarea></div></div><div class="notice" style="margin:15px 0">Le visuel importé est intégré aux données locales de cette application. Pensez à exporter une sauvegarde après avoir ajouté des photos.</div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end"><button type="button" onclick="closeEditor()">Annuler</button>${id?`<button type="button" class="danger" onclick="deletePost('${p.id}')">Supprimer</button>`:""}<button type="submit" class="btn-primary">Enregistrer le contenu</button></div></form></div></div>`;
let input=$("#pImage");input.addEventListener("change",handleImageUpload);window._editingImage=p.imageData||"";}
function handleImageUpload(e){let f=e.target.files[0];if(!f)return;if(!f.type.startsWith("image/")){toast("Choisissez un fichier image.");return}if(f.size>5*1024*1024){toast("Image supérieure à 5 Mo. Réduisez-la avant importation.");e.target.value="";return}let r=new FileReader();r.onload=()=>{window._editingImage=r.result;$("#imageInfo").textContent="Image ajoutée : "+f.name;updatePreviewIfNeeded()};r.readAsDataURL(f)}
function removeCurrentImage(){window._editingImage="";$("#pImage").value="";$("#imageInfo").textContent="Aucune image associée."}
function updatePreviewIfNeeded(){}
function savePost(e){e.preventDefault();let id=$("#postId").value||uid();let old=state.posts.find(p=>p.id===id)||{};let p={...old,id,day:parseInt($("#pDay").value)||"",title:$("#pTitle").value.trim(),type:$("#pType").value.trim()||"Autre",goal:$("#pGoal").value.trim(),imageIdea:$("#pIdea").value.trim(),imageText:$("#pImageText").value.trim(),imageData:window._editingImage||"",caption:$("#pCaption").value.trim(),hashtags:$("#pHashtags").value.trim(),story:$("#pStory").value.trim(),platform:$("#pPlatform").value,status:$("#pStatus").value,publishedDate:$("#pPublishedDate").value,notes:$("#pNotes").value.trim(),done:$("#pStatus").value==="Publié"||!!old.done};let ix=state.posts.findIndex(x=>x.id===id);if(ix>=0)state.posts[ix]=p;else state.posts.push(p);save();closeEditor();render();toast("Contenu enregistré.")}
function closeEditor(){$("#modalRoot").innerHTML="";window._editingImage=""}
function deletePost(id){if(!confirm("Supprimer définitivement ce contenu ?"))return;state.posts=state.posts.filter(p=>p.id!==id);save();closeEditor();render();toast("Contenu supprimé.")}
function copyText(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast("Texte copié dans le presse-papiers.")).catch(()=>fallbackCopy(text))}else fallbackCopy(text)}
function fallbackCopy(text){let a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Texte copié.")}catch(e){showCopyModal(text)}a.remove()}
function showCopyModal(text){$("#modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeEditor()"><div class="modal"><div class="close-row"><h3>Copier le texte</h3><button onclick="closeEditor()">✕</button></div><textarea class="tall" id="copyFallback">${esc(text)}</textarea><button onclick="$('#copyFallback').select();document.execCommand('copy');toast('Texte sélectionné/copié.')">Sélectionner et copier</button></div></div>`}
function copyPost(id){let p=state.posts.find(x=>x.id===id);if(!p)return;let all=`${p.title}\n\nIDÉE D'IMAGE\n${p.imageIdea}\n\nTEXTE SUR L'IMAGE\n${p.imageText}\n\nLÉGENDE\n${p.caption}\n\nHASHTAGS\n${p.hashtags}\n\nSTORY\n${p.story}`;copyText(all)}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),settings:state.settings,posts:state.posts,tasks:state.tasks},null,2)],{type:"application/json"});downloadBlob(blob,"elegance-house-sauvegarde.json");toast("Sauvegarde préparée.")}
function downloadBlob(blob,name){let u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function exportCalendar(){let rows=[["Jour","Titre","Type","Objectif","Idée image","Texte image","Légende","Hashtags","Story","Plateforme","Statut","Date publiée"]];state.posts.slice().sort((a,b)=>(a.day||999)-(b.day||999)).forEach(p=>rows.push([p.day,p.title,p.type,p.goal,p.imageIdea,p.imageText,p.caption,p.hashtags,p.story,p.platform,p.status,p.publishedDate]));let csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");downloadBlob(new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"}),"elegance-house-calendrier.csv")}
function importData(file){let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!Array.isArray(x.posts)||!x.settings)throw new Error("format");if(!confirm("Importer cette sauvegarde et remplacer les données actuellement ouvertes ?"))return;state.settings={...initialSettings,...x.settings};state.posts=x.posts;state.tasks=x.tasks||{};save();render();toast("Sauvegarde restaurée.")}catch(e){toast("Fichier invalide ou incompatible.")}};r.readAsText(file)}
function saveBrand(){let s=state.settings;s.brand=$("#brandName").value.trim()||"Élégance House";s.tagline=$("#brandTagline").value.trim();s.sector=$("#brandSector").value.trim();s.positioning=$("#brandPositioning").value.trim();s.city=$("#brandCity").value.trim();s.contact=$("#brandContact").value.trim();s.whatsapp=$("#brandWhatsapp").value.trim();s.facebook=$("#brandFacebook").value.trim();s.instagram=$("#brandInstagram").value.trim();s.site=$("#brandSite").value.trim();s.notes=$("#brandNotes").value.trim();s.primary=$("#colorPrimary").value;s.gold=$("#colorGold").value;s.dark=$("#colorDark").value;s.rose=$("#colorRose").value;save();render();toast("Identité de marque enregistrée.")}
function resetSeed(){if(!confirm("Remplacer tous les contenus actuels par les 30 modèles de départ ? Exportez d'abord vos données si nécessaire."))return;state.posts=SEED.map(p=>({...p,id:uid(),imageData:"",publishedDate:"",notes:"",done:false}));save();render();toast("Les 30 contenus de départ sont restaurés.")}
function clearAll(){if(!confirm("Effacer tous les contenus et paramètres enregistrés sur cet appareil ? Cette action est irréversible sans sauvegarde."))return;localStorage.removeItem("ehStudioData");state={settings:{...initialSettings},posts:SEED.map(p=>({...p,id:uid(),imageData:"",done:false})),tasks:{},page:"dashboard",editingId:null};save();render();toast("Données locales effacées.")}
document.querySelectorAll(".nav").forEach(b=>b.addEventListener("click",()=>setPage(b.dataset.page)));
$("#newPostBtn").addEventListener("click",()=>openEditor());
$("#exportBtn").addEventListener("click",exportData);
$("#importBtn").addEventListener("click",()=>$("#importFile").click());
$("#importFile").addEventListener("change",e=>{if(e.target.files[0])importData(e.target.files[0]);e.target.value=""});
load();render();
</script>

<script>
/* ===== v2 : NOUVEL ACCUEIL, MODE MODIFICATION, IMAGES, AIDE ===== */
/* ★ TEXTES PAR DÉFAUT DE L'ACCUEIL (vous pouvez aussi les changer directement dans l'application) */
const D={heroPre:"Bienvenue sur",heroSub:"Votre studio de contenu, simple et efficace.",f1:"Contenus prêts à publier",f2:"En quelques clics",f3:"100% adapté à votre marque",f4:"30 jours de contenu",sSub:"MODE • ACCESSOIRES • STYLE",slogan:"Votre style, notre inspiration.",t5:"5 posts prêts à publier",t5s:"Des visuels professionnels et des textes déjà rédigés. Il vous suffit de les personnaliser ou de les publier directement !",pubT:"Prêt(e) à publier ?",pubS:"En un clic, copiez vos textes et images ou publiez directement sur vos réseaux.",b0:"Tout est déjà préparé pour vous !",b0s:"Vous n'avez qu'à personnaliser et publier. C'est aussi simple que ça !",b1:"5 types de posts modèles",b2:"30 jours de contenu planifié",b3:"Textes + hashtags prêts",b4:"Stories incluses (si besoin)",b5:"Images libres à personnaliser"};
const P={crown:'<path d="M3 7l4 4 5-6 5 6 4-4-2 12H5z"/>',home:'<path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',image:'<path d="M4 4h16v16H4zM4 16l5-5 4 4 3-3 4 4"/><circle cx="9" cy="9" r="1.5"/>',cal:'<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>',star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/>',gear:'<circle cx="12" cy="12" r="3.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 .5c0 1.7-2.5 2-2.5 3.5M12 17h.01"/>',spark:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',bolt:'<path d="M13 2L5 14h6l-1 8 8-12h-6z"/>',heart:'<path d="M12 20s-8-5-8-11a4.5 4.5 0 018-2.5A4.5 4.5 0 0120 9c0 6-8 11-8 11z"/>',rocket:'<path d="M5 19c0-3 1-4 3-5M14 4c4 0 6 2 6 6-2 4-5 6-8 7l-5-5c1-3 3-6 7-8zM9 17l-3 3"/>',dl:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',file:'<path d="M6 3h8l4 4v14H6zM9 12h6M9 16h6"/>',edit:'<path d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/>',chev:'<path d="M6 9l6 6 6-6"/>',phone:'<path d="M8 3h8v18H8zM11 18h2"/>'};
const I=(n,s=22)=>`<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${P[n]}</svg>`;
const ui=()=>state.settings.ui||(state.settings.ui={});
const T=k=>ui()[k]??D[k];
const E=(k,t="span")=>`<${t} data-t="${k}">${esc(T(k))}</${t}>`;
const nextPosts=()=>state.posts.filter(p=>!p.done&&p.status!=="Publié").sort((a,b)=>(a.day||999)-(b.day||999)).slice(0,5);
function hero(){let s=state.settings;return `<section class="hero"><div class="hero-img" ${state.edit?'onclick="chooseHero()" title="Changer la photo"':''}><img src="${s.heroImg||heroMock()}" alt="">${state.edit?'<span class="tip">📷 Cliquez pour ajouter votre photo (paysage, sujet à gauche, fond clair)</span>':''}</div><div class="hero-body"><div class="hp">${E('heroPre')}</div><h2 data-t="@brand">${esc(s.brand)}</h2><p>${E('heroSub')}</p><div class="feats">${[['spark','f1'],['bolt','f2'],['heart','f3'],['cal','f4']].map(([i,k])=>`<div>${I(i,26)}${E(k,'div')}</div>`).join('')}</div></div></section>`}
function card(p){let t=(p.caption||"").replace(/\s+/g," ").slice(0,95);return `<article class="mini"><div class="mv">${p.imageData?`<img src="${p.imageData}" alt="">`:''}<b>${esc(p.title)}</b></div><span class="pill">${p.day}. ${esc(p.type)}</span><h4>${esc(p.title)}</h4><p>${esc(t)}…</p><button onclick="openEditor('${p.id}')">Voir le contenu</button></article>`}
function miniCal(){let st=state.settings.startDate||new Date().toISOString().slice(0,10),off=(new Date(st+"T12:00:00").getDay()+6)%7,by={};state.posts.forEach(p=>by[p.day]=p);let c=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"].map(d=>`<i class="dn">${d}</i>`).join("")+"<i></i>".repeat(off);for(let d=1;d<=30;d++){let p=by[d],k=!p?"":(p.done||p.status==="Publié")?"g":p.status==="Brouillon"?"n":"r";c+=`<i class="d ${k}" ${p?`onclick="openEditor('${p.id}')"`:""}>${d}</i>`}return `<div class="box"><h3>${I('cal',26)} Calendrier 30 jours</h3><div class="mc">${c}</div><div class="lg"><span class="g">Post publié</span><span class="r">À publier</span><span class="n">Brouillon</span></div></div>`}
function rail(){return `<div class="rail"><div class="brandsw">${I('crown',30)}${brandSel()}</div>${miniCal()}<div class="box pub"><h3>${I('rocket',30)} ${E('pubT')}</h3><p>${E('pubS')}</p><button class="btn-dark big" onclick="publishNow()">${I('edit',20)} Publier maintenant</button></div><div class="box"><h3>${I('spark',26)} Accès rapide</h3><button class="qa" onclick="printCal()">${I('dl',20)} Télécharger tout le calendrier (PDF)</button><button class="qa" onclick="exportCalendar()">${I('file',20)} Exporter le calendrier (Excel)</button><button class="qa" onclick="exportICS()">${I('bolt',20)} Rappels sur mon téléphone</button><button class="qa" onclick="setPage('images')">${I('image',20)} Voir mes images</button><button class="qa" onclick="setPage('brand')">${I('star',20)} Modifier ma marque</button></div></div>`}
function dashboard(){let f=nextPosts();return `<div class="dash"><div><div class="editbar"><button onclick="toggleEdit()" class="${state.edit?'btn-primary':''}">${state.edit?'✓ Terminer les modifications':'✎ Modifier cette page'}</button>${state.edit?'<span>Cliquez sur un texte ou sur la photo pour le changer.</span>':''}${state.edit&&state.settings.heroImg?'<button class="danger" onclick="rmHero()">Retirer la photo</button>':''}</div>${hero()}<section class="box wide"><h3>${I('spark',28)} ${E('t5')}</h3><p>${E('t5s')}</p><div class="minis">${f.map(card).join('')||'<div class="empty">Tous vos contenus sont publiés. Créez-en un nouveau !</div>'}</div></section><section class="strip"><div><h3>${E('b0')}</h3><p>${E('b0s')}</p></div>${[['image','b1'],['cal','b2'],['edit','b3'],['phone','b4'],['image','b5']].map(([i,k])=>`<div class="bi"><span>${I(i,26)}</span>${E(k,'div')}</div>`).join('')}</section></div>${rail()}</div>`}
function render(){let s=state.settings;$("#sBrand").textContent=s.brand||"Élégance House";$("#sSub").textContent=T('sSub');$("#sSlogan").textContent=T('slogan');document.querySelectorAll('.side [data-t]').forEach(e=>e.contentEditable=!!state.edit);let m=$("#main");m.innerHTML=({dashboard,posts:postsPage,calendar:calendarPage,images:imagesPage,brand:brandPage,settings:settingsPage,help:helpPage}[state.page]||dashboard)();m.querySelectorAll('[data-t]').forEach(e=>e.contentEditable=!!state.edit);document.body.classList.toggle('editing',!!state.edit)}
function toggleEdit(){state.edit=!state.edit;render();if(!state.edit)toast("Modifications enregistrées.")}

function trackOpen(id){let p=state.posts.find(x=>x.id===id),r=p.res||{};$("#modalRoot").innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeEditor()"><div class="modal"><div class="close-row"><h3>Résultats : ${esc(p.title)}</h3><button onclick="closeEditor()">✕</button></div><p class="small">Quelques heures après la publication, notez les chiffres affichés sous votre post.</p><div class="form-grid">${[["l","J'aime"],["c","Commentaires"],["s","Partages"],["m","Messages reçus"]].map(([k,n])=>`<div class="field"><label>${n}</label><input id="r_${k}" type="number" min="0" value="${r[k]||""}"></div>`).join("")}</div><br><button class="btn-primary" onclick="trackSave('${id}')">Enregistrer</button></div></div>`}
function trackSave(id){let p=state.posts.find(x=>x.id===id);p.res={};["l","c","s","m"].forEach(k=>p.res[k]=+$("#r_"+k).value||0);save();closeEditor();render();toast("Résultats enregistrés.")}
const rt=p=>p.res?p.res.l+p.res.c*2+p.res.s*3+p.res.m*3:0;
function resultsPage(){let a=state.posts.filter(p=>p.res),S=k=>a.reduce((n,p)=>n+p.res[k],0),ty={};a.forEach(p=>ty[p.type]=(ty[p.type]||0)+rt(p));let best=Object.entries(ty).sort((x,y)=>y[1]-x[1])[0];return pageHead("Suivi","Mes résultats","Notez les résultats de chaque publication pour savoir ce que vos clients aiment.")+`<div class="grid stats">${[["J'aime","l"],["Commentaires","c"],["Partages","s"],["Messages","m"]].map(([n,k])=>`<div class="stat"><span>${n}</span><strong>${S(k)}</strong></div>`).join("")}</div>`+(best&&best[1]?`<div class="notice">Le type de post qui marche le mieux : <b>${esc(best[0])}</b>. Publiez-en davantage !</div><br>`:"")+`<div class="panel"><h3>Mes publications</h3>${state.posts.slice().sort((x,y)=>rt(y)-rt(x)||(x.day||999)-(y.day||999)).filter(p=>p.done||p.status==="Publié"||p.res).map(p=>`<div class="kpi"><span>Jour ${p.day} · ${esc(p.title)}</span><span>${p.res?`❤ ${p.res.l} · 💬 ${p.res.c} · ↗ ${p.res.s} · ✉ ${p.res.m}`:'<span class="muted">non noté</span>'} <button class="btn-small" onclick="trackOpen('${p.id}')">Saisir</button></span></div>`).join("")||"<p>Publiez un contenu (« C'est publié ✓ ») pour pouvoir noter ses résultats.</p>"}</div>`}
const _r3=render;render=function(){_r3();if(state.page==="results")$("#main").innerHTML=(state.guide!=null?gbar():"")+resultsPage();if(state.page==="calendar"){let t=document.querySelector("#main .toolbar");if(t)t.insertAdjacentHTML("beforeend",'<button onclick="exportICS()">🔔 Rappels téléphone</button>')}};
document.querySelector('.side .nav[data-page="settings"]').insertAdjacentHTML("beforebegin",'<button class="nav" data-page="results"><span class="ico"></span>Résultats</button>');
let _n=document.querySelector('.side .nav[data-page="results"]');_n.querySelector(".ico").innerHTML=I('bolt',26);_n.addEventListener("click",()=>setPage("results"));
G.find(g=>g[2]==="calendar")[1]+=" Cliquez sur « 🔔 Rappels téléphone » pour recevoir un rappel chaque jour sur votre téléphone.";
G.splice(G.length-1,0,["Noter les résultats","Après la publication, cliquez sur « Saisir » : notez les j'aime, commentaires, partages et messages. L'application vous montre ce qui marche le mieux.","results"]);

/* ===== v2.4 : PLUSIEURS PAGES / BOUTIQUES + CATÉGORIES PERSONNELLES ===== */
function brands(){try{let b=JSON.parse(localStorage.getItem("ehBrands"));if(Array.isArray(b)&&b.length)return b}catch(e){}return[{id:"b1",name:state.settings.brand}]}
const act=()=>localStorage.getItem("ehActive")||"b1";
function brandSel(){let B=brands(),a=act();return `<select class="bsel" onchange="switchBrand(this.value)">${B.map(b=>`<option value="${b.id}" ${b.id===a?"selected":""}>${esc(b.id===a?state.settings.brand:b.name)}</option>`).join("")}<option value="+">＋ Ajouter une page…</option><option value="-">🗑 Supprimer cette page…</option></select>`}
function stash(){save();let B=brands(),a=act(),e=B.find(b=>b.id===a),raw=localStorage.getItem("ehStudioData");if(e)e.name=state.settings.brand;else B.push({id:a,name:state.settings.brand});localStorage.removeItem("ehStudioData");localStorage.setItem("ehBrand_"+a,raw);return B}
function resetState(s){state.settings=s||{...initialSettings};state.posts=[];state.tasks={};load();state.guide=null;state.edit=false}
function switchBrand(v){if(v==="+")return addBrand();if(v==="-")return delBrand();if(v===act())return;let raw=localStorage.getItem("ehBrand_"+v);if(!raw)return render();let B=stash();localStorage.removeItem("ehBrand_"+v);localStorage.setItem("ehStudioData",raw);localStorage.setItem("ehActive",v);localStorage.setItem("ehBrands",JSON.stringify(B));resetState();setPage("dashboard");toast("Page ouverte : "+state.settings.brand)}
function addBrand(){let n=(prompt("Nom de la nouvelle page / boutique :")||"").trim();if(!n)return render();let B=stash(),id="b"+Date.now().toString(36);B.push({id,name:n});localStorage.setItem("ehBrands",JSON.stringify(B));localStorage.setItem("ehActive",id);resetState({...initialSettings,brand:n,tagline:"",sector:"",city:"",positioning:"",brandApplied:"Élégance House",ui:{sSub:"VOTRE PAGE"}});applyBrand(n);save();setPage("brand");toast("Page créée ! Choisissez maintenant son secteur d'activité.")}
function delBrand(){let B=brands();if(B.length<2){toast("Il faut garder au moins une page.");return render()}if(!confirm("Supprimer définitivement la page « "+state.settings.brand+" » et tout son contenu ?"))return render();let a=act();B=B.filter(b=>b.id!==a);let n=B[0],raw=localStorage.getItem("ehBrand_"+n.id);if(!raw)return render();localStorage.removeItem("ehBrand_"+n.id);localStorage.setItem("ehStudioData",raw);localStorage.setItem("ehActive",n.id);localStorage.setItem("ehBrands",JSON.stringify(B));resetState();setPage("dashboard");toast("Page supprimée.")}
/* catégories personnelles (communes à toutes vos pages) */
try{JSON.parse(localStorage.getItem("ehCats")||"[]").forEach(c=>SEC.splice(SEC.length-1,0,c))}catch(e){}
function addCat(){let n=(prompt("Nom de votre catégorie (ex. Vente de meubles) :")||"").trim();if(!n)return;let p=(prompt("Vos produits ou services, au pluriel (ex. meubles) :")||"").trim();if(!p)return;let a=(prompt("Quelques exemples séparés par une virgule (ex. canapés, tables, lits) :")||"").trim()||"nos nouveautés, nos best-sellers ou nos offres";let c=[n,p,"une solution",a,"votre produit ou service bien mis en valeur","✨",n.toUpperCase().slice(0,24)+" • QUALITÉ","Votre satisfaction, notre priorité.",slug(n)+" Qualite Nouveautes"];let L=[];try{L=JSON.parse(localStorage.getItem("ehCats")||"[]")}catch(e){}L.push(c);localStorage.setItem("ehCats",JSON.stringify(L));SEC.splice(SEC.length-1,0,c);render();$("#secSel").value=SEC.length-2;genSector()}
const _sv=savePost;savePost=function(e){let id=$("#postId").value;_sv(e);let p=id&&state.posts.find(x=>x.id===id);if(p){p.edited=true;save()}};
const _r4=render;render=function(){_r4();let e=$("#sPages");if(e)e.innerHTML=brandSel()};
G.find(g=>g[0].startsWith("Choisir")).splice(1,1,"Choisissez la catégorie de votre page (ex. Fabricant de chaussures) : les 30 posts changent automatiquement. Vous pouvez en changer à tout moment, ou créer votre propre catégorie avec « ＋ Ma propre catégorie ».");
G.splice(G.length-1,0,["Gérer plusieurs pages","Sous le nom de la marque (menu de gauche), ouvrez la liste : choisissez une autre page ou « ＋ Ajouter une page… ». Chaque page a ses propres posts, images, couleurs et résultats.","dashboard"]);

/* ===== v2.5 : VISUELS MODÈLES CRÉÉS AUTOMATIQUEMENT (hors connexion) ===== */
function wrapT(t,n){let o=[];String(t||"").split("\n").forEach(l=>{let c="";l.split(" ").forEach(w=>{if((c+" "+w).trim().length>n&&c){o.push(c);c=w}else c=(c+" "+w).trim()});o.push(c)});return o}
function mock(p,W=1080,H=1350){let s=state.settings,v=(p.day||0)%4,bg=[s.primary,s.dark,s.rose,s.gold][v],fg=v===1?"#ffffff":s.dark,ac=v===1||v===0||v===2?s.gold:s.dark,L=wrapT(p.imageText||p.title,16).slice(0,6),fs=L.length>4?72:92,y0=H/2-(L.length-1)*fs*.6;
let svg=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${bg}"/><stop offset="1" stop-color="${v===3?s.primary:s.rose}"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><rect x="50" y="50" width="${W-100}" height="${H-100}" fill="none" stroke="${ac}" stroke-width="3"/><text x="${W/2}" y="150" text-anchor="middle" font-family="Georgia,serif" font-size="38" letter-spacing="8" fill="${ac}">${esc(String(s.brand).toUpperCase())}</text>${L.map((l,i)=>`<text x="${W/2}" y="${y0+i*fs*1.2}" text-anchor="middle" font-family="Georgia,serif" font-size="${fs}" fill="${fg}">${esc(l)}</text>`).join("")}<text x="${W/2}" y="${H-110}" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" fill="${fg}" opacity=".7">${esc(s.tagline||"")}</text></svg>`;return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)}
function heroMock(){let s=state.settings,c=SEC.find(x=>x[0]===s.sector),e=c?c[5]:"✨";return "data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${s.gold}"/><stop offset="1" stop-color="${s.rose}"/></linearGradient></defs><rect width="100%" height="100%" fill="url(#g)"/><text x="400" y="360" text-anchor="middle" font-size="220">${e}</text></svg>`)}
function dlMock(id){let p=state.posts.find(x=>x.id===id),i=new Image();i.onload=()=>{let c=document.createElement("canvas");c.width=1080;c.height=1350;c.getContext("2d").drawImage(i,0,0);c.toBlob(b=>downloadBlob(b,"visuel-jour-"+p.day+".png"))};i.src=mock(p)}
const _pc=postCard;postCard=function(p){return _pc(p.imageData?p:{...p,imageData:mock(p)})};
const _cd=card;card=function(p){return _cd(p.imageData?p:{...p,imageData:mock(p)})};
function rmPost(id){let p=state.posts.find(x=>x.id===id);if(!p||!p.imageData)return;if(!confirm("Retirer votre photo ? Le visuel modèle reviendra à sa place."))return;p.imageData="";save();render();toast("Photo retirée : le visuel modèle est revenu.")}
function gPick(id){pickImage(d=>{state.posts.find(x=>x.id===id).imageData=d;save();render();toast("Photo ajoutée.")})}
function guidePanel(){return `<div class="panel"><h3>${I('image',24)} Mes visuels à préparer</h3><p>Chaque post a un visuel modèle créé automatiquement, avec votre texte et vos couleurs. Dessous, la photo à prendre. <b>Format conseillé : vertical 4:5 (1080×1350)</b>. Pour voir de vraies photos du même genre, cliquez sur « Pexels » ou « Unsplash » (sites gratuits, Internet nécessaire), téléchargez celle qui vous plaît, puis « Ajouter ma photo ».</p>${state.posts.slice().sort((a,b)=>(a.day||999)-(b.day||999)).map(p=>`<div class="kpi"><span class="gl"><img src="${p.imageData||mock(p)}" alt=""><span><b>Jour ${p.day} · ${esc(p.title)}</b><br><small class="muted">📷 ${esc(p.imageIdea||"Choisissez une photo de votre activité.")}</small></span></span><span class="ga"><span class="tag">${p.imageData?"✓ photo ajoutée":"à ajouter"}</span><button class="btn-small" onclick="gPick('${p.id}')">${p.imageData?"Changer ma photo":"Ajouter ma photo"}</button>${p.imageData?`<button class="btn-small danger" onclick="rmPost('${p.id}')">Retirer ma photo</button>`:""}<button class="btn-small" onclick="photoSearch('${p.id}','p')">🔍 Pexels</button><button class="btn-small" onclick="photoSearch('${p.id}','u')">🔍 Unsplash</button><button class="btn-small" onclick="dlMock('${p.id}')">Télécharger le modèle</button></span></div>`).join("")}</div>`}
const _r5=render;render=function(){_r5();if(state.page==="images"){let e=document.querySelector("#main .page-head");if(e)e.insertAdjacentHTML("afterend",guidePanel())}};
G.find(g=>g[0]==="Ajouter mes images")[1]="Chaque post a déjà un visuel modèle créé automatiquement. Dans « Mes visuels à préparer », voyez quelle photo prendre, puis cliquez sur « Ajouter ma photo » pour remplacer le modèle. « Télécharger le modèle » donne un visuel prêt à publier.";

/* ===== v2.6 : RÉINITIALISATION SÉCURISÉE + RECHERCHE DE PHOTOS RÉELLES ===== */
function photoSearch(id,site){let p=state.posts.find(x=>x.id===id),c=SEC.find(x=>x[0]===state.settings.sector),q=(c?c[1]+" "+c[4]:(p.imageIdea||p.title)).split(/[.:]/)[0].slice(0,80);window.open(site==="u"?"https://unsplash.com/s/photos/"+encodeURIComponent(q):"https://www.pexels.com/search/"+encodeURIComponent(q)+"/","_blank")}
function backupNow(){try{exportData()}catch(e){}}
function restoreTexts(){let s=state.settings,i=SEC.findIndex(c=>c[0]===s.sector);state.posts.forEach(p=>p.edited=false);
if(i===SEC.length-1)toast("Catégorie « Autre » : choisissez-la à nouveau dans « Ma marque » pour régénérer les textes.");
else if(i>=0){window._secIdx=i;genSector();window._secIdx=null}
else{SEED.forEach(d=>{let p=state.posts.find(x=>x.day===d.day);if(p)["title","imageIdea","imageText","caption","hashtags","story"].forEach(k=>{if(d[k]!==undefined)p[k]=d[k]})});s.brandApplied="Élégance House";applyBrand(s.brand)}
save();render()}
resetSeed=function(){if(!confirm("Remettre les textes d'origine des 30 posts ?\n\n✔ Conservés : vos photos, vos statuts « publié », vos notes, votre marque.\n✘ Remplacés : seulement les textes que vous avez modifiés.\n\nUne sauvegarde sera téléchargée automatiquement avant."))return;backupNow();restoreTexts();toast("Textes d'origine remis. Vos photos sont conservées.")};
clearAll=function(){if(!confirm("Retirer VOS photos et VOS modifications sur cette page ?\n\n✘ Effacé : vos photos, vos textes modifiés, vos statuts, notes et résultats.\n✔ Conservé : les 30 posts d'origine, le nom et les couleurs de la marque, vos autres pages, vos catégories.\n\nUne sauvegarde sera téléchargée automatiquement avant."))return;backupNow();state.posts.forEach(p=>{p.imageData="";p.done=false;p.status="À préparer";p.notes="";p.publishedDate="";delete p.res});state.settings.heroImg="";state.settings.lib=[];restoreTexts();toast("Page remise à l'état d'origine. Sauvegarde téléchargée.")};
$("#crown").innerHTML=I('crown',40);save();render();
</script>
